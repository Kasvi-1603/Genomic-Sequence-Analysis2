[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "igda"
version = "0.1.0"
description = "Intelligent Genome & Data Anomaly Detection — DAA string matching lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
deploy = ["gunicorn>=21.2; sys_platform != 'win32'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
